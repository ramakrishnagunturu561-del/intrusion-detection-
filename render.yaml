services:
  # The FastAPI Backend
  - type: web
    name: intrusion-detection-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*" # Set this to your Vercel URL later for security

  # The Frontend (Static Site - Faster, no Docker build issues)
  - type: web
    name: intrusion-detection-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: intrusion-detection-api
          envVarKey: RENDER_EXTERNAL_URL
